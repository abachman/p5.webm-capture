<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="/dist/p5.webm-capture.js"></script>
    <meta charset="utf-8">
  </head>
  <body>
    <script>
      const FRAMES = 30
      const FRAME_RATE = 30
      let c = 0;

      function setup() {
        createCanvas(400, 400);
        colorMode(HSB);
        frameRate(FRAME_RATE);
        enableCapture({
          frameCount: FRAMES,
          frameRate: FRAME_RATE,
          verbose: true,
          display: true,
          format: 'mp4',
        });
      }

      function draw() {
        background(c, 100, 100);
        c = (c + (360 / FRAMES)) % 360
        captureFrame();
      }
    </script>
  </body>
</html>
